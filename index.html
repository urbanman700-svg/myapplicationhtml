
<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>ShopZone</title>
    <link rel='stylesheet' href='css/style.css'>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href='#home' class='active'>Home</a></li>
                <li><a href='#electronics'>Electronics</a></li>
                <li><a href='#fashion'>Fashion</a></li>
                <li><a href='#home-kitchen'>Home & Kitchen</a></li>
                <li><a href='#cart' id='cart-link'>Cart (<span id='cart-count'>0</span>)</a></li>
            </ul>
        </nav>
    </header>
    <section id='home' class='hero'>
        <h1>Welcome to ShopZone</h1>
        <button class='btn' id='shop-now'>Shop Now</button>
    </section>
    <section id='electronics' class='electronics'>
        <h1>Electronics</h1>
        <div class='product-grid'>
            <div class='product'>
                <img src='img/product1.jpg' alt='Product 1'>
                <h2>Product 1</h2>
                <p>$100</p>
                <button class='btn' id='add-to-cart-1'>Add to Cart</button>
            </div>
            <div class='product'>
                <img src='img/product2.jpg' alt='Product 2'>
                <h2>Product 2</h2>
                <p>$200</p>
                <button class='btn' id='add-to-cart-2'>Add to Cart</button>
            </div>
            <div class='product'>
                <img src='img/product3.jpg' alt='Product 3'>
                <h2>Product 3</h2>
                <p>$300</p>
                <button class='btn' id='add-to-cart-3'>Add to Cart</button>
            </div>
        </div>
    </section>
    <section id='fashion' class='fashion'>
        <h1>Fashion</h1>
        <div class='product-grid'>
            <div class='product'>
                <img src='img/product4.jpg' alt='Product 4'>
                <h2>Product 4</h2>
                <p>$50</p>
                <button class='btn' id='add-to-cart-4'>Add to Cart</button>
            </div>
            <div class='product'>
                <img src='img/product5.jpg' alt='Product 5'>
                <h2>Product 5</h2>
                <p>$75</p>
                <button class='btn' id='add-to-cart-5'>Add to Cart</button>
            </div>
            <div class='product'>
                <img src='img/product6.jpg' alt='Product 6'>
                <h2>Product 6</h2>
                <p>$100</p>
                <button class='btn' id='add-to-cart-6'>Add to Cart</button>
            </div>
        </div>
    </section>
    <section id='home-kitchen' class='home-kitchen'>
        <h1>Home & Kitchen</h1>
        <div class='product-grid'>
            <div class='product'>
                <img src='img/product7.jpg' alt='Product 7'>
                <h2>Product 7</h2>
                <p>$25</p>
                <button class='btn' id='add-to-cart-7'>Add to Cart</button>
            </div>
            <div class='product'>
                <img src='img/product8.jpg' alt='Product 8'>
                <h2>Product 8</h2>
                <p>$50</p>
                <button class='btn' id='add-to-cart-8'>Add to Cart</button>
            </div>
            <div class='product'>
                <img src='img/product9.jpg' alt='Product 9'>
                <h2>Product 9</h2>
                <p>$100</p>
                <button class='btn' id='add-to-cart-9'>Add to Cart</button>
            </div>
        </div>
    </section>
    <section id='cart' class='cart'>
        <h1>Cart</h1>
        <div class='cart-products'></div>
        <button class='btn' id='checkout'>Checkout</button>
    </section>
    <script src='js/index.js'></script>
</body>
</html>
