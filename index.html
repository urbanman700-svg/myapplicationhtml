<!DOCTYPE html><html><head><title>Calculator</title><style>body { font-family: Arial, sans-serif; background-color: #f0f0f0; } #calculator { width: 200px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); background-color: #fff; } #display { width: 100%; height: 40px; margin-bottom: 20px; padding: 10px; border: none; border-radius: 10px; font-size: 24px; text-align: right; } .button { width: 40px; height: 40px; margin: 5px; padding: 10px; border: none; border-radius: 10px; background-color: #fff; font-size: 18px; } .button:hover { background-color: #f0f0f0; } .operator { background-color: #ff9900; color: #fff; } .operator:hover { background-color: #ffad33; } </style></head><body><div id="calculator"><input type="text" id="display" disabled><div><button class="button" onclick="clearDisplay()">C</button><button class="button" onclick="backspace()">DEL</button></div><div><button class="button" onclick="appendNumber(7)">7</button><button class="button" onclick="appendNumber(8)">8</button><button class="button" onclick="appendNumber(9)">9</button><button class="button operator" onclick="appendOperator('/')">/</button></div><div><button class="button" onclick="appendNumber(4)">4</button><button class="button" onclick="appendNumber(5)">5</button><button class="button" onclick="appendNumber(6)">6</button><button class="button operator" onclick="appendOperator('*')">*</button></div><div><button class="button" onclick="appendNumber(1)">1</button><button class="button" onclick="appendNumber(2)">2</button><button class="button" onclick="appendNumber(3)">3</button><button class="button operator" onclick="appendOperator('-')">-</button></div><div><button class="button" onclick="appendNumber(0)">0</button><button class="button" onclick="appendDecimal()">.</button><button class="button operator" onclick="appendOperator('+')">+</button><button class="button operator" onclick="calculate()">=</button></div></div><script>let display = document.getElementById('display');let currentNumber = '';let previousNumber = '';let operator = '';function appendNumber(number) { currentNumber += number.toString(); display.value = currentNumber; }function appendOperator(op) { previousNumber = currentNumber; operator = op; currentNumber = ''; }function calculate() { let result; switch (operator) { case '+': result = parseFloat(previousNumber) + parseFloat(currentNumber); break; case '-': result = parseFloat(previousNumber) - parseFloat(currentNumber); break; case '*': result = parseFloat(previousNumber) * parseFloat(currentNumber); break; case '/': result = parseFloat(previousNumber) / parseFloat(currentNumber); break; default: result = 0; } display.value = result; currentNumber = result.toString(); previousNumber = ''; operator = ''; }function clearDisplay() { display.value = ''; currentNumber = ''; previousNumber = ''; operator = ''; }function backspace() { currentNumber = currentNumber.slice(0, -1); display.value = currentNumber; }function appendDecimal() { if (!currentNumber.includes('.')) { currentNumber += '.'; display.value = currentNumber; } }</script></body></html>
